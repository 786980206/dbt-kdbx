[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-kdbx"
version = "0.1.0"
description = "dbt adapter for kdb+/KDB-X"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.8.0",
    "dbt-adapters>=1.0.0",
    "pykx>=4.0.0",
    "agate>=1.0.0",
]

[project.entry-points.dbt]
kdbx = "dbt.adapters.kdbx"

[tool.hatch.build.targets.wheel]
packages = ["dbt"]
