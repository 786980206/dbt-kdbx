name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON: python

jobs:
  build:
    name: Build backends + Rust host (static verification only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # dbt-core (the v2 adapter dev monorepo) is a large submodule used only
        # for local adapter development; do not pull it in CI.
        with:
          submodules: false

      - name: Init nanoarrow submodule (needed by build.sh)
        run: |
          git submodule update --init --depth 1 driver/thirdparty/nanoarrow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc build-essential

      - name: Install Python deps (build-time only)
        run: |
          pip install --upgrade pip

      - name: Build both backends
        run: |
          cd driver
          ./build.sh

      - name: Check exported symbols (backend A + B)
        run: |
          for sym in AdbcDriverKdbxInit; do
            nm -D driver/build/libadbc_driver_kdbx.so | grep -q "$sym" && echo "backend A: $sym OK"
          done
          for sym in AdbcBackendBInit AdbcDriverKdbxBInit; do
            nm -D driver/kdbx_adbc/_backend_b.so | grep -q "$sym" && echo "backend B: $sym OK"
          done

      - name: Check artifacts not stripped of needed metadata
        run: |
          test -f driver/kdbx_adbc/libadbc_driver_kdbx.so && echo "backend A copied to wheel OK"
          test -f driver/kdbx_adbc/bridge.py && echo "bridge.py present"

      - name: Build Rust host (release)
        run: |
          cd driver/rust
          cargo build --release --locked

      - name: Verify Rust host links
        run: |
          ldd driver/rust/target/release/adbc_host | grep -q "libc" && echo "adbc_host links OK"
